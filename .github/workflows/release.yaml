# A GitHub release for each new manifest version; HACS installs from these.
# Runs on the mirror's master, which GitLab's sync-to-github job pushes.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '.version // empty' custom_components/ezlo_camerahub/manifest.json)
          if [ -z "$version" ]; then
            echo "No version in manifest.json"
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists"
            exit 0
          fi
          git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
