name: Validate HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # A HACS custom repository, not in the default store, so not
          # registered in home-assistant/brands: the icons ship in
          # custom_components/ezlo_camerahub/brand/ instead.
          ignore: "brands"
