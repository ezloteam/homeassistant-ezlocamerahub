[project]
name = "homeassistant-ezlo-camerahub"
version = "0.1.0"
description = "Home Assistant integration for the Ezlo Camera Hub (local ha-camerasd engine)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.ezlo_camerahub"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.ezlo_camerahub", "homeassistant"]
force-sort-within-sections = true
combine-as-imports = true
